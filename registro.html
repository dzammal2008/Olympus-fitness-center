<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,
initial-scale=1">
<title>registro olympus fitness center</title>
	<!-- Web realizada por: Daniel Zamorano Maldonado -->
</head>
<body>
	<!-- Contenido principal -->
	<p><h1>Registro</h1></p>
	<p><form name="inscripción"
			action="#"
			method="post">
			Nombre: <input type="text" name="inputNombre"><br>
			<p>Contraseña: <input type="password" name="inputPassword"><br>
			<p>Casilla de verificacion: <input type="checkbox" name="CheckboxVerification"><br>
			<p>Selección: <input type="radio" name="CasillaSelección"><br>
			<p>Documentación: <input type="file" name="SubirArchivo"><br>
			Elige una clase:
			<select name="SelectClase" id="idSelectClase">
			<option value="Zumba">Zumba</option>
			<option value="Yoga">Yoga</option>
			<option value="Spinning">Spinning</option>
			</select><br>
			<textarea name="textareaComentarios" id="idtextareaComentarios"
			cols="20" rows="8"></textarea><br>
			<p><input type="submit" name="submitComentarios"
			id="idsubmitComentarios" value="Enviar alta">
			<input type="reset" name="resetComentarios"
			id="idresetComentarios" value="Reset"></p>
		</form>

</body>
</html>
